[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hf-preflight"
version = "0.2.0"
description = "Check a Hugging Face model before you download it — gated, licence, size, and whether loading it runs someone else's code"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aravind S" }]
keywords = ["huggingface", "machine-learning", "security", "cli", "supply-chain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ARAVIND281/hf-preflight"
Issues = "https://github.com/ARAVIND281/hf-preflight/issues"

[project.scripts]
hf-preflight = "hf_preflight.cli:main"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
